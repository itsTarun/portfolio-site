name: Internal Link Smoke Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  internal-link-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must precede setup-node: the pnpm cache lookup needs pnpm on PATH.
      # Version comes from the packageManager field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Run internal link smoke checks
        run: pnpm test:links
